services:
  db:
    image: pgvector/pgvector:pg16
    container_name: slrms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slrms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slrms_password}
      POSTGRES_DB: ${POSTGRES_DB:-slrms}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slrms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: slrms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: slrms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-minio-secret-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        mc alias set local http://minio:9000 "$${STORAGE_ACCESS_KEY_ID}" "$${STORAGE_SECRET_ACCESS_KEY}" &&
        mc mb --ignore-existing "local/$${STORAGE_BUCKET}"
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:-slrms-documents}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minio}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minio-secret-change-me}
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    build: ./backend
    container_name: slrms-migrate
    command: sh -c "alembic upgrade head && python -m app.seed"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: slrms-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-${GEMINI_MODEL}}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-models/gemini-embedding-001}
      GEMINI_EMBEDDING_DIM: ${GEMINI_EMBEDDING_DIM:-384}
      GEMINI_EMBEDDING_BATCH_TOKENS: ${GEMINI_EMBEDDING_BATCH_TOKENS:-27000}
      GEMINI_EMBEDDING_CHUNK_TOKENS: ${GEMINI_EMBEDDING_CHUNK_TOKENS:-500}
      GEMINI_EMBEDDING_CHUNK_OVERLAP_TOKENS: ${GEMINI_EMBEDDING_CHUNK_OVERLAP_TOKENS:-80}
      DOCUMENT_PROCESSING_MODE: ${DOCUMENT_PROCESSING_MODE:-celery}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-${REDIS_URL}}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-slrms-documents}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minio}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minio-secret-change-me}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  worker:
    build: ./backend
    container_name: slrms-worker
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-${REDIS_URL}}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-slrms-documents}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minio}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minio-secret-change-me}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-${GEMINI_MODEL}}
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    container_name: slrms-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
  minio_data:
