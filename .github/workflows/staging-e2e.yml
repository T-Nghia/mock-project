name: Staging document lifecycle E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"

concurrency:
  group: staging-document-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      APP_URL: ${{ vars.STAGING_APP_URL }}
      API_URL: ${{ vars.STAGING_API_URL }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
      DOCUMENT_PROCESSING_TIMEOUT_MS: "300000"
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:lifecycle
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-document-lifecycle-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14
