name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: slrms
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: slrms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slrms -d slrms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENV: test
      DATABASE_URL: postgresql+psycopg2://slrms:ci-password@localhost:5432/slrms_test
      JWT_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic
      - run: alembic upgrade head
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Start MinIO
        working-directory: .
        run: |
          docker compose up -d minio
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9000/minio/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs minio
          exit 1
      - name: Test S3-compatible storage
        env:
          RUN_S3_INTEGRATION: "1"
          STORAGE_BACKEND: s3
          STORAGE_BUCKET: slrms-documents
          STORAGE_ENDPOINT_URL: http://localhost:9000
          STORAGE_REGION: us-east-1
          STORAGE_ACCESS_KEY_ID: minio
          STORAGE_SECRET_ACCESS_KEY: minio-secret-change-me
        run: python -m unittest tests.integration.test_storage_s3 -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
