name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: slrms
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: slrms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slrms -d slrms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENV: test
      DATABASE_URL: postgresql+psycopg2://slrms:ci-password@localhost:5432/slrms_test
      UPLOAD_FOLDER_TEST_DATABASE_URL: postgresql+psycopg2://slrms:ci-password@localhost:5432/slrms_test
      DELETE_TEST_DATABASE_URL: postgresql+psycopg2://slrms:ci-password@localhost:5432/slrms_test
      CLEANUP_TEST_DATABASE_URL: postgresql+psycopg2://slrms:ci-password@localhost:5432/slrms_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-secret
      CI_MINIO_CONTAINER: slrms-ci-minio-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic
      - name: Type-check production-critical backend paths
        run: >-
          mypy app/core/config.py app/core/rate_limit.py app/models/document.py
          app/repositories/document_repo.py app/services/document_service.py
          app/models/storage_cleanup.py app/repositories/storage_cleanup_repo.py
          app/services/document_deletion_service.py
          app/services/storage_cleanup_service.py app/cleanup_worker.py
          app/core/maintenance.py app/services/cleanup_operations.py app/cleanup_operator.py
          app/storage_certification.py app/storage_backup.py app/cleanup_health.py
          app/services/chat_service.py app/repositories/chat_repo.py app/schemas/chat.py
          app/services/storage.py app/services/document_dispatcher.py
          app/tasks/document_processing.py app/worker.py
          --ignore-missing-imports --check-untyped-defs --explicit-package-bases
      - run: alembic upgrade head
      - run: alembic check
      - run: coverage run --source=app -m unittest discover -s tests -p "test_*.py" -v
      - run: coverage report --fail-under=70
      - name: Start MinIO
        working-directory: .
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          MINIO_ROOT_USER="ci-$(python -c 'import secrets; print(secrets.token_hex(8))')"
          MINIO_ROOT_PASSWORD="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          echo "::add-mask::$MINIO_ROOT_USER"
          echo "::add-mask::$MINIO_ROOT_PASSWORD"
          {
            echo "STORAGE_ACCESS_KEY_ID=$MINIO_ROOT_USER"
            echo "STORAGE_SECRET_ACCESS_KEY=$MINIO_ROOT_PASSWORD"
          } >> "$GITHUB_ENV"
          export MINIO_ROOT_USER MINIO_ROOT_PASSWORD
          docker run --detach --name "$CI_MINIO_CONTAINER" \
            --publish 127.0.0.1:9000:9000 \
            --tmpfs /data:rw,uid=65532,gid=65532,mode=0700,size=512m \
            --env MINIO_ROOT_USER --env MINIO_ROOT_PASSWORD --env MINIO_BROWSER=off \
            --cap-drop ALL --security-opt no-new-privileges \
            cgr.dev/chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82 \
            server /data --address :9000
          for _ in {1..30}; do
            if curl --fail --silent --output /dev/null --connect-timeout 1 --max-time 2 \
              http://127.0.0.1:9000/minio/health/ready; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::CI MinIO did not become ready within the polling deadline"
          exit 1
      - name: Test S3-compatible storage
        env:
          RUN_S3_INTEGRATION: "1"
          STORAGE_BACKEND: s3
          STORAGE_BUCKET: slrms-ci-storage-${{ github.run_id }}-${{ github.run_attempt }}
          STORAGE_ENDPOINT_URL: http://127.0.0.1:9000
          STORAGE_REGION: us-east-1
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.loadTestsFromName("tests.integration.test_storage_s3")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun == 0 or result.skipped:
              sys.exit("S3 integration tests must pass without skips")
          PY
      - name: Test storage reliability and real Celery redelivery
        env:
          RUN_RELIABILITY_INTEGRATION: "1"
          RUN_CELERY_INTEGRATION: "1"
          STORAGE_BACKEND: s3
          STORAGE_BUCKET: slrms-ci-reliability-${{ github.run_id }}-${{ github.run_attempt }}
          STORAGE_ENDPOINT_URL: http://127.0.0.1:9000
          STORAGE_REGION: us-east-1
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "tests.integration.test_storage_reliability",
              "tests.integration.test_celery_redelivery",
              "tests.integration.test_local_reliability",
              "tests.test_storage_cleanup.LocalDeletionContractTestCase",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun == 0 or result.skipped:
              sys.exit("Reliability integration tests must pass without skips")
          PY
      - name: Test cleanup with Redis and Celery stopped
        env:
          CI_REDIS_CONTAINER: ${{ job.services.redis.id }}
          RUN_BROKER_DOWN_INTEGRATION: "1"
          STORAGE_BACKEND: s3
          STORAGE_BUCKET: slrms-ci-independent-${{ github.run_id }}-${{ github.run_attempt }}
          STORAGE_ENDPOINT_URL: http://127.0.0.1:9000
          STORAGE_REGION: us-east-1
        run: |
          set -euo pipefail
          docker stop "$CI_REDIS_CONTAINER" >/dev/null
          trap 'docker start "$CI_REDIS_CONTAINER" >/dev/null' EXIT
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.loadTestsFromName("tests.integration.test_cleanup_independence")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun == 0 or result.skipped:
              sys.exit("Broker-independent cleanup must pass without skips")
          PY
      - name: Install pinned Caddy proxy test binary
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          caddy_dir="$RUNNER_TEMP/slrms-caddy-2.10.2"
          mkdir -p "$caddy_dir"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 120 \
            https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz \
            --output "$caddy_dir/caddy.tar.gz"
          printf '%s  %s\n' 5c218bc34c9197369263da7e9317a83acdbd80ef45d94dca5eff76e727c67cdd "$caddy_dir/caddy.tar.gz" | sha256sum --check -
          tar -xzf "$caddy_dir/caddy.tar.gz" --directory "$caddy_dir" caddy
          echo "CADDY_TEST_BINARY=$caddy_dir/caddy" >> "$GITHUB_ENV"
      - name: Test operational recovery and real backup restore
        env:
          PG_TEST_CONTAINER: ${{ job.services.postgres.id }}
          RUN_CADDY_INTEGRATION: "1"
          RUN_RELIABILITY_INTEGRATION: "1"
          STORAGE_BACKEND: s3
          STORAGE_BUCKET: slrms-ci-operations-${{ github.run_id }}-${{ github.run_attempt }}
          STORAGE_ENDPOINT_URL: http://127.0.0.1:9000
          STORAGE_REGION: us-east-1
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "tests.integration.test_cleanup_operations",
              "tests.integration.test_cleanup_rollout",
              "tests.integration.test_storage_backup",
              "tests.test_cleanup_rollout",
              "tests.integration.test_cleanup_proxy",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun < 35 or result.skipped:
              sys.exit("Operational recovery tests must pass without skips")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install real browser acceptance dependencies
        working-directory: .
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm ci --prefix e2e --no-audit --no-fund
          cd e2e
          npx playwright install --with-deps chromium
      - name: Real backend browser acceptance
        working-directory: .
        timeout-minutes: 8
        env:
          RUN_OPERATIONAL_E2E: "1"
          STORAGE_BACKEND: s3
          STORAGE_BUCKET: slrms-ci-browser-unused
          STORAGE_ENDPOINT_URL: http://127.0.0.1:9000
          STORAGE_REGION: us-east-1
        run: python scripts/test/operational_acceptance.py
      - name: MinIO logs on failure
        if: failure()
        run: |
          if docker container inspect "$CI_MINIO_CONTAINER" >/dev/null 2>&1; then
            docker logs "$CI_MINIO_CONTAINER"
          fi
      - name: Clean up CI MinIO
        if: always()
        run: |
          if docker container inspect "$CI_MINIO_CONTAINER" >/dev/null 2>&1; then
            docker rm --force "$CI_MINIO_CONTAINER"
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Validate Playwright test discovery
        env:
          APP_URL: https://staging.example.com
          API_URL: https://api.staging.example.com
          SMOKE_EMAIL: smoke@example.com
          SMOKE_PASSWORD: ci-placeholder-not-used
        run: npx playwright test --list

  containers:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://slrms:ci-password@db:5432/slrms
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ci-only-secret-that-is-at-least-32-characters
      STORAGE_BUCKET: slrms-documents
      STORAGE_ACCESS_KEY_ID: minio
      STORAGE_SECRET_ACCESS_KEY: minio-secret-change-me
      CORS_ORIGINS: '["https://staging.example.com"]'
      NEXT_PUBLIC_API_URL: https://api.staging.example.com
    steps:
      - uses: actions/checkout@v4
      - name: Validate merged production Compose
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Validate merged staging HTTPS Compose
        env:
          APP_DOMAIN: staging.example.com
          API_DOMAIN: api.staging.example.com
          ACME_EMAIL: ops@example.com
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.staging.yml config --quiet
      - name: Assert private infrastructure and no source bind mounts
        run: |
          docker compose --profile cleanup -f docker-compose.yml -f docker-compose.prod.yml config --format json > /tmp/compose.json
          python - <<'PY'
          import json
          config = json.load(open('/tmp/compose.json'))
          for name in ('db', 'redis', 'minio'):
              assert not config['services'][name].get('ports'), f'{name} exposes host ports'
          for name in ('migrate', 'backend', 'worker', 'cleanup'):
              for volume in config['services'][name].get('volumes', []):
                  if volume.get('type') == 'bind':
                      assert volume['target'] == '/run/slrms/cleanup-target.json' and volume.get('read_only'), f'{name} contains an unexpected bind mount'
          cleanup = config['services']['cleanup']
          assert cleanup['profiles'] == ['cleanup']
          assert set(cleanup['depends_on']) <= {'db', 'migrate'}
          assert cleanup['environment']['CLEANUP_ENABLED'] == 'false'
          assert config['services']['backend']['environment']['DOCUMENT_DELETE_ENABLED'] == 'false'
          PY
      - name: Build production images
        run: docker compose --profile cleanup -f docker-compose.yml -f docker-compose.prod.yml build backend worker cleanup frontend
